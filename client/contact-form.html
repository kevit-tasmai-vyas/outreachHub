<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OutreachHub - Contact Form</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body class="contacts-page">

  <header class="navbar">
    <a href="home.html" class="logo">
      <img class="logo-img" src="assets/images/logo.png" alt="logo">
      <span>OutreachHub</span>
    </a>

    <input type="checkbox" id="menu-checkbox">
    <label for="menu-checkbox" class="menu-icon"><span></span></label>

    <nav class="nav-links">
      <a href="home.html">Home</a>
      <a href="contacts.html" class="active">Contacts</a>
      <a href="#">Templates</a>
      <a href="#">Campaigns</a>
      <a href="login.html" class="logout-link">Logout</a>
    </nav>
  </header>

  <main class="container">

    <div class="page-top">
      <h1>Add / Edit Contact</h1>
    </div>

    <div class="card small-card">
      <form id="contact-form" action="contact-details.html" method="get">

        <div class="form-group">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" required>
        </div>

        <div class="form-group">
          <label for="phone">Phone</label>
          <input type="tel" id="phone" name="phone" pattern="[0-9]{10}" required>
          <small>10 digits. The phone number identifies the contact.</small>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email">
        </div>
        <div class="form-group">
          <label for="image">Image Link</label>
          <input type="url" id="image" name="image">
          <small>Optional. Leave empty to use the default picture.</small>
        </div>

        <div class="form-group">
          <label for="tags">Tags</label>
          <input type="text" id="tags" name="tags">
          <small>Separate tags with commas, e.g. customers, vip</small>
        </div>

        <div class="form-buttons">
          <button type="submit" class="btn btn-blue">Save</button>
          <a href="contacts.html" class="btn btn-gray">Cancel</a>
        </div>

      </form>
    </div>

  </main>

</body>
</html>
